name: OpenCode Factory - up to 3 issues

# Zero configuration, like the previous pilot: no GitHub
# Variables to create, no issue_key required, no Jira story changes.
# schedule (no inputs) uses the same defaults: mode=build, empty issue_key,
# max_issues=3.
#  - issue_key set     => that story only (max_issues is ignored).
#  - issue_key empty   => deterministic selection (REST/JQL, NO LLM) of up to
#    max_issues eligible stories by Rank ASC (1-3, default 3).
#  - none eligible     => NO_WORK, green, factory matrix does not run.
#  - Ready = Listo and Done = Finalizada (same rule as the Claude/Cursor contracts).
#  - Repository defaults to this repo when the story does not declare one.
#  - ENABLE_OPENCODE_FACTORY_PILOT is OPTIONAL: only the literal value 'false'
#    acts as a kill switch for build; unset => runs normally.
#  - OPENCODE_VERSION pins the CLI (opencode-ai at that version, not the floating dist-tag).
# Concurrency is the workflow, not each matrix job: one run per repo.
# The factory matrix runs up to 3 stories at once (fail-fast off). Each job
# has the same caps and branches from a fresh fetch of origin/master.
on:
  schedule:
    - cron: '0 23 * * *' # 00:00 Europe/Madrid en invierno (CET); en verano (CEST) sería '0 22 * * *'
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Opcional: clave Jira exacta (p. ej. KAN-9). Vacío = selección automática (hasta max_issues)"
        type: string
        required: false
        default: ""
      mode:
        description: "inspect consumes no LLM quota; build runs one guarded execution per selected story"
        type: choice
        required: true
        default: build
        options:
          - inspect
          - build
      max_issues:
        description: "Stories por run si issue_key está vacío (1-3). Por defecto 3. Con issue_key solo se procesa esa"
        type: choice
        required: false
        default: "3"
        options:
          - "1"
          - "2"
          - "3"

concurrency:
  group: opencode-factory-${{ github.repository }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: 1.19.4
  OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
  OPENCODE_CONFIG_CONTENT: '{"default_agent":"factory-orchestrator","provider":{"opencode-go":{"options":{"apiKey":"{env:OPENCODE_GO_API_KEY}"}}}}'
  JIRA_URL: ${{ vars.JIRA_URL }}
  JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'KAN' }}
  # Optional custom-field overrides; empty => description parsing / defaults.
  JIRA_REPOSITORY_FIELD_ID: ${{ vars.JIRA_REPOSITORY_FIELD_ID }}
  JIRA_DEPENDENCIES_FIELD_ID: ${{ vars.JIRA_DEPENDENCIES_FIELD_ID }}
  # Ready=Listo / Done=Finalizada are fixed in jira_gate.py (Claude contract
  # rule, "any other name is not Ready/Done"); nothing to configure.
  JIRA_HUMAN_REVIEW_STATUS: ${{ vars.JIRA_HUMAN_REVIEW_STATUS || 'Human Review' }}
  JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NO_COLOR: '1'
  OPENCODE_DISABLE_AUTOUPDATE: 'true'

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      issues: ${{ steps.gate.outputs.issues }}
      has_work: ${{ steps.gate.outputs.has_work }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure GitHub CLI/git credentials (no write yet)
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null
          gh auth setup-git

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          opencode --version
          python --version

      - name: Verify identities and available models (ZERO LLM tokens)
        shell: bash
        run: |
          set -euo pipefail
          python automation/opencode/check_config.py

      - name: Select eligible stories (ZERO LLM tokens)
        id: gate
        shell: bash
        env:
          MODE: ${{ github.event_name == 'schedule' && 'build' || github.event.inputs.mode }}
          ISSUE_KEY: ${{ github.event_name == 'schedule' && '' || github.event.inputs.issue_key }}
          MAX_ISSUES: ${{ github.event_name == 'schedule' && '3' || github.event.inputs.max_issues }}
        run: |
          set -euo pipefail
          # Empty ISSUE_KEY => deterministic auto-selection (no LLM). NO_WORK exits 0.
          # issue_key set => that key only. max_issues is 1-3 (default 3).
          python automation/opencode/jira_gate.py \
            --issue "$ISSUE_KEY" --mode "$MODE" --max-issues "${MAX_ISSUES:-3}"

  factory:
    needs: select
    if: ${{ needs.select.outputs.has_work == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        issue: ${{ fromJson(needs.select.outputs.issues || '[]') }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub CLI/git credentials (no write yet)
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null
          gh auth setup-git

      - name: Install uv for Jira MCP
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          opencode --version
          python --version

      - name: Verify identities and available models (ZERO LLM tokens)
        shell: bash
        run: |
          set -euo pipefail
          python automation/opencode/check_config.py
          uvx mcp-atlassian --help >/dev/null

      - name: Verify Jira issue, dependencies and routing (ZERO LLM tokens)
        id: gate
        shell: bash
        env:
          MODE: ${{ github.event_name == 'schedule' && 'build' || github.event.inputs.mode }}
          ISSUE_KEY: ${{ matrix.issue }}
        run: |
          set -euo pipefail
          python automation/opencode/jira_gate.py --issue "$ISSUE_KEY" --mode "$MODE"

      - name: Optional kill switch (only when the variable is literally 'false')
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'build') && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ENABLE_PILOT: ${{ vars.ENABLE_OPENCODE_FACTORY_PILOT }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_PILOT" = "false" ]; then
            echo "CONFIG_BLOCKED: ENABLE_OPENCODE_FACTORY_PILOT=false switches build off (delete the variable or set true to run)"
            exit 2
          fi
          echo "Build enabled (ENABLE_OPENCODE_FACTORY_PILOT='${ENABLE_PILOT:-<unset>}')"

      - name: Prepare dedicated feature branch (NO LLM)
        id: branch
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'build') && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          BRANCH: ${{ steps.gate.outputs.branch }}
        run: |
          set -euo pipefail
          # Factory rule (all providers): feature branches come from a FRESH
          # fetch of origin/master, never from a stale local branch.
          DEFAULT_BRANCH="master"
          if ! git ls-remote --exit-code --heads origin master >/dev/null; then
            echo 'CONFIG_BLOCKED: origin/master not found; factory base branch must be master'
            exit 2
          fi
          git fetch origin "$DEFAULT_BRANCH"
          BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git switch -c "$BRANCH" "$BASE_SHA"
          gh auth setup-git
          git config user.name 'agentic-factory[bot]'
          git config user.email 'agentic-factory@users.noreply.github.com'
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Prepared $BRANCH from freshly fetched origin/$DEFAULT_BRANCH ($BASE_SHA)"

      - name: One guarded Kimi K3.1 Pro + DeepSeek V4.1 Flash + Kimi K3.1 Pro execution
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'build') && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.gate.outputs.issue }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          set -euo pipefail
          python automation/opencode/guarded_run.py \
            --issue "$ISSUE_KEY" --base "$BASE_SHA" \
            --no-edit-seconds 900 --total-seconds 20400 \
            --max-reported-input-tokens 5000000

      # Preserve the builder's work when the run fails: write the diff against
      # BASE_SHA (tracked + untracked files) to a .patch and upload it. NEVER
      # pushes and can never fail the job (temporary index, exit 0, continue-on-error).
      - name: Save working-tree diff as artifact (NO push, never fails)
        id: diff
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          set +e
          OUT_DIR="$RUNNER_TEMP/opencode-factory-diff"
          mkdir -p "$OUT_DIR"
          if [ -z "${BASE_SHA:-}" ]; then
            echo "No BASE_SHA (no build branch prepared); no diff to save"
            exit 0
          fi
          # Temporary index so the real index is untouched; nothing is committed or pushed.
          TMP_INDEX="$RUNNER_TEMP/opencode-factory-diff.index"
          cp "$(git rev-parse --git-path index)" "$TMP_INDEX" 2>/dev/null || true
          export GIT_INDEX_FILE="$TMP_INDEX"
          git add -A
          git diff --cached --binary "$BASE_SHA" > "$OUT_DIR/opencode-factory.patch"
          if [ -s "$OUT_DIR/opencode-factory.patch" ]; then
            echo "Saved diff vs $BASE_SHA: $(wc -l < "$OUT_DIR/opencode-factory.patch") lines"
            git diff --cached --stat "$BASE_SHA" || true
          else
            rm -f "$OUT_DIR/opencode-factory.patch"
            echo "No changes vs $BASE_SHA; no patch written"
          fi
          rm -f "$TMP_INDEX"
          exit 0

      - name: Upload diff artifact (if any)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: opencode-factory-diff-${{ matrix.issue }}
          path: ${{ runner.temp }}/opencode-factory-diff/*.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify published Draft PR, reviewer marker and Jira (READ ONLY)
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'build') && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.gate.outputs.issue }}
        run: |
          set -euo pipefail
          python automation/opencode/postflight.py --issue "$ISSUE_KEY"

      - name: Upload sanitized execution summary (NO raw LLM/Jira logs)
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'build') && steps.gate.outputs.has_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-factory-summary-${{ matrix.issue }}
          path: ${{ runner.temp }}/opencode-factory-summary.json
          if-no-files-found: ignore
          retention-days: 7
