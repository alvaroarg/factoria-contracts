name: OpenCode Factory - bounded single issue

# Deliberately manual. Zero configuration, like the previous pilot: no GitHub
# Variables to create, no issue_key required, no Jira story changes.
#  - issue_key empty  => deterministic selection (REST/JQL, NO LLM) of the FIRST
#    eligible story by Rank ASC; one issue per run; none => NO_WORK, green.
#  - Ready = Listo and Done = Finalizada (same rule as the Claude/Cursor contracts).
#  - Repository defaults to this repo when the story does not declare one.
#  - ENABLE_OPENCODE_FACTORY_PILOT is OPTIONAL: only the literal value 'false'
#    acts as a kill switch for build; unset => runs normally.
on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Opcional: clave Jira exacta (p. ej. KAN-9). Vacío = selección automática de la primera story elegible"
        type: string
        required: false
        default: ""
      mode:
        description: "inspect consumes no LLM quota; build is one guarded execution"
        type: choice
        required: true
        default: build
        options:
          - inspect
          - build

concurrency:
  group: opencode-factory-${{ github.repository }}
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"factory-orchestrator","provider":{"opencode-go":{"options":{"apiKey":"{env:OPENCODE_GO_API_KEY}"}}}}'
      JIRA_URL: ${{ vars.JIRA_URL }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'KAN' }}
      # Optional custom-field overrides; empty => description parsing / defaults.
      JIRA_REPOSITORY_FIELD_ID: ${{ vars.JIRA_REPOSITORY_FIELD_ID }}
      JIRA_DEPENDENCIES_FIELD_ID: ${{ vars.JIRA_DEPENDENCIES_FIELD_ID }}
      # Ready=Listo / Done=Finalizada are fixed in jira_gate.py (Claude contract
      # rule, "any other name is not Ready/Done"); nothing to configure.
      JIRA_HUMAN_REVIEW_STATUS: ${{ vars.JIRA_HUMAN_REVIEW_STATUS || 'Human Review' }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NO_COLOR: '1'
      OPENCODE_DISABLE_AUTOUPDATE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub CLI/git credentials (no write yet)
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null
          gh auth setup-git

      - name: Install uv for Jira MCP
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@latest
          opencode --version
          python --version

      - name: Verify identities and available models (ZERO LLM tokens)
        shell: bash
        run: |
          set -euo pipefail
          python automation/opencode/check_config.py
          uvx mcp-atlassian --help >/dev/null

      - name: Verify Jira issue, dependencies and routing (ZERO LLM tokens)
        id: gate
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ISSUE_KEY: ${{ inputs.issue_key }}
        run: |
          set -euo pipefail
          # Empty ISSUE_KEY => deterministic auto-selection (no LLM). NO_WORK exits 0.
          python automation/opencode/jira_gate.py --issue "$ISSUE_KEY" --mode "$MODE"

      - name: Optional kill switch (only when the variable is literally 'false')
        if: ${{ inputs.mode == 'build' && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ENABLE_PILOT: ${{ vars.ENABLE_OPENCODE_FACTORY_PILOT }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_PILOT" = "false" ]; then
            echo "CONFIG_BLOCKED: ENABLE_OPENCODE_FACTORY_PILOT=false switches build off (delete the variable or set true to run)"
            exit 2
          fi
          echo "Build enabled (ENABLE_OPENCODE_FACTORY_PILOT='${ENABLE_PILOT:-<unset>}')"

      - name: Prepare dedicated feature branch (NO LLM)
        id: branch
        if: ${{ inputs.mode == 'build' && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          BRANCH: ${{ steps.gate.outputs.branch }}
        run: |
          set -euo pipefail
          # Factory rule (all providers): feature branches come from a FRESH
          # fetch of origin/master, never from a stale local branch.
          DEFAULT_BRANCH="master"
          if ! git ls-remote --exit-code --heads origin master >/dev/null; then
            echo 'CONFIG_BLOCKED: origin/master not found; factory base branch must be master'
            exit 2
          fi
          git fetch origin "$DEFAULT_BRANCH"
          BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git switch -c "$BRANCH" "$BASE_SHA"
          gh auth setup-git
          git config user.name 'agentic-factory[bot]'
          git config user.email 'agentic-factory@users.noreply.github.com'
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Prepared $BRANCH from freshly fetched origin/$DEFAULT_BRANCH ($BASE_SHA)"

      - name: One guarded Kimi K3 + DeepSeek V4 Pro + Kimi K3 execution
        if: ${{ inputs.mode == 'build' && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.gate.outputs.issue }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          set -euo pipefail
          python automation/opencode/guarded_run.py \
            --issue "$ISSUE_KEY" --base "$BASE_SHA" \
            --no-edit-seconds 360 --total-seconds 2700 \
            --max-reported-input-tokens 800000

      # Preserve the builder's work when the run fails: write the diff against
      # BASE_SHA (tracked + untracked files) to a .patch and upload it. NEVER
      # pushes and can never fail the job (temporary index, exit 0, continue-on-error).
      - name: Save working-tree diff as artifact (NO push, never fails)
        id: diff
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          set +e
          OUT_DIR="$RUNNER_TEMP/opencode-factory-diff"
          mkdir -p "$OUT_DIR"
          if [ -z "${BASE_SHA:-}" ]; then
            echo "No BASE_SHA (no build branch prepared); no diff to save"
            exit 0
          fi
          # Temporary index so the real index is untouched; nothing is committed or pushed.
          TMP_INDEX="$RUNNER_TEMP/opencode-factory-diff.index"
          cp "$(git rev-parse --git-path index)" "$TMP_INDEX" 2>/dev/null || true
          export GIT_INDEX_FILE="$TMP_INDEX"
          git add -A
          git diff --cached --binary "$BASE_SHA" > "$OUT_DIR/opencode-factory.patch"
          if [ -s "$OUT_DIR/opencode-factory.patch" ]; then
            echo "Saved diff vs $BASE_SHA: $(wc -l < "$OUT_DIR/opencode-factory.patch") lines"
            git diff --cached --stat "$BASE_SHA" || true
          else
            rm -f "$OUT_DIR/opencode-factory.patch"
            echo "No changes vs $BASE_SHA; no patch written"
          fi
          rm -f "$TMP_INDEX"
          exit 0

      - name: Upload diff artifact (if any)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: opencode-factory-diff
          path: ${{ runner.temp }}/opencode-factory-diff/*.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify published Draft PR, reviewer marker and Jira (READ ONLY)
        if: ${{ inputs.mode == 'build' && steps.gate.outputs.has_work == 'true' }}
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.gate.outputs.issue }}
        run: |
          set -euo pipefail
          python automation/opencode/postflight.py --issue "$ISSUE_KEY"

      - name: Upload sanitized execution summary (NO raw LLM/Jira logs)
        if: ${{ always() && inputs.mode == 'build' && steps.gate.outputs.has_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-factory-summary
          path: ${{ runner.temp }}/opencode-factory-summary.json
          if-no-files-found: ignore
          retention-days: 7
